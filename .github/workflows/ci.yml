# Lint, type-check, unit tests, production build and browser tests (Playwright + axe).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          path: web
      # Apps link to ../shared packages (link: dependencies) until they are published.
      - uses: actions/checkout@v5
        with:
          repository: bibiyo21/mediconnect-shared
          path: shared
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            shared/pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Build shared packages
        working-directory: shared
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests (Playwright + axe)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
